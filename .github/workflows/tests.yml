name: BackOffice Automated Test Suite & Quality Gates

on:
  push:
    branches: [ master, develop, main ]
  pull_request:
    branches: [ master, develop, main ]

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} - Automated Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite
          coverage: none

      - name: Validate Composer Configuration
        run: composer validate --strict

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check for Known Vulnerabilities
        run: composer audit

      - name: Execute Automated Test Suite (PHPUnit)
        run: ./vendor/bin/phpunit --no-coverage --display-deprecations --display-warnings
